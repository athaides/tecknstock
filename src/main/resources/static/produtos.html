<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>TecnoStock - Principal</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet"
          href="css/produtos.css">
</head>

<body>

<div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <h2>TecnoStock</h2>

        <a href="produtos.html"> Principal</a>
        <a href="usuarios.html"> Usuários</a>
        <a href="fornecedores.html"> Fornecedores</a>
        <a href="relatorios.html"> 📊Relatórios</a>

    </aside>

    <!-- CONTEÚDO -->
    <main class="main-content">

        <div class="container">

            <!-- HEADER -->
            <header>

                <div>

                    <h1>📦 Principal</h1>

                    <p>
                        Gerenciamento de Produtos
                    </p>

                </div>

            </header>

            <!-- CADASTRO -->
            <section class="card cadastro">

                <h2>
                    Cadastrar Produto
                </h2>

                <div class="form-grid">

                    <div class="input-group">

                        <label for="nome">
                            Nome do Produto
                        </label>

                        <input
                                type="text"
                                id="nome"
                                placeholder="Ex: Teclado Mecânico">

                    </div>

                    <div class="input-group">

                        <label for="descricao">
                            Descrição
                        </label>

                        <input
                                type="text"
                                id="descricao"
                                placeholder="Ex: RGB Switch Blue">

                    </div>

                    <div class="input-group">

                        <label for="preco">
                            Preço (R$)
                        </label>

                        <input
                                type="number"
                                step="0.01"
                                id="preco"
                                placeholder="0.00">

                    </div>

                    <div class="input-group">

                        <label for="quantidade">
                            Quantidade
                        </label>

                        <input
                                type="number"
                                id="quantidade"
                                placeholder="0">

                    </div>

                    <div class="input-group">

                        <label for="idFornecedor">
                            Fornecedor
                        </label>

                        <select id="idFornecedor">

                            <option value="">
                                Selecione um fornecedor
                            </option>

                        </select>

                    </div>

                </div>

                <button
                        class="btn-primary"
                        onclick="cadastrarProduto()">

                    Cadastrar Produto

                </button>

                <p id="mensagem"></p>

            </section>

            <!-- LISTA -->
            <!-- LISTA -->
            <section class="card lista">
                <div class="topo-lista">
                    <h2>Produtos Cadastrados</h2>

                    <!-- CAMPO DE BUSCA NOVO -->
                    <div class="busca-container">
                        <span class="lupa-icone">&#128269;</span>
                        <input
                                type="text"
                                id="inputBusca"
                                placeholder="Pesquisar produto..."
                                onkeyup="filtrarProdutos()"
                        >
                    </div>

                    <button class="btn-refresh" onclick="carregarProdutos()">
                        Atualizar
                    </button>
                </div>

                <div id="listaProdutos" class="produtos-grid">
                </div>
            </section>


        </div>

    </main>

</div>

<script src="js/produtos.js"></script>

</body>
</html>
